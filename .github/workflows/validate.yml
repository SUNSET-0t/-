name: Native extension validation
on:
  push:
    branches: [main, 'fix/**', 'feature/**']
  pull_request:
permissions:
  contents: read
jobs:
  native-api-and-mobile:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      ST_SOURCE_DIR: /tmp/npc-st-source
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Fetch pinned native host source for contract tests (no secrets)
        run: |
          mkdir -p "$ST_SOURCE_DIR"
          curl --fail --silent --show-error 'https://raw.githubusercontent.com/SillyTavern/SillyTavern/06bde939fb1e9c4c8d8641d810f0a916b5bce127/src/endpoints/secrets.js' > "$ST_SOURCE_DIR/secrets.js"
      - name: Syntax and native credential/transport contracts
        run: |
          for file in native/*.mjs tests/native*.mjs release-0.3.0.js; do node --check "$file"; done
          node --test tests/native-client.test.mjs tests/native-stream.test.mjs
          node -e "const fs=require('fs'),m=JSON.parse(fs.readFileSync('manifest.json'));if(m.js!=='release-0.3.0.js')throw Error('wrong active entry');for(const f of ['native/client.mjs','native/protocol.mjs','native/ui.mjs','native/entry.mjs']){const s=fs.readFileSync(f,'utf8');if(/fetch\(['\"]https?:/.test(s))throw Error('direct vendor request');}"
      - name: Install browser test dependencies
        run: npm install --no-save --no-package-lock jquery@3.7.1 playwright@1.56.1 express@4.21.2
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Phone and desktop native-host integration (mock provider, no paid API)
        run: node tests/native-browser.mjs
      - name: Save test screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: npc-native-ui
          path: test-artifacts/
          if-no-files-found: ignore
