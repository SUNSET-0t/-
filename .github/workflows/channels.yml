name: Independent channels integration tests
on:
  push:
    branches: ['feature/independent-channels', main]
  pull_request:
permissions:
  contents: read
jobs:
  isolated-service-and-mobile-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax, package entries and offline protocol/security tests
        run: |
          for file in connections/*.mjs server/*.mjs channels-entry.js bootstrap.js tests/channels-browser.mjs; do node --check "$file"; done
          node -e "const fs=require('fs');const m=JSON.parse(fs.readFileSync('manifest.json'));const p=JSON.parse(fs.readFileSync('package.json'));if(m.js!=='channels-entry.js'||p.main!=='server/index.mjs')throw Error('Incorrect release entrypoints');"
          node --test tests/providers.test.mjs tests/channels-server.test.mjs tests/provider-silicon.test.mjs
      - name: Install browser test dependencies
        run: npm install --no-save --no-package-lock jquery@3.7.1 jsdom@25 playwright@1.56.1 express@4.21.2
      - name: Install test browser
        run: npx playwright install --with-deps chromium
      - name: Existing interface regression tests
        run: |
          node tests/ui-smoke.mjs
          node tests/browser-ui.mjs
      - name: Real browser and local isolated-service integration
        run: node tests/channels-browser.mjs
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: npc-channel-screenshots
          path: test-artifacts/
          if-no-files-found: ignore
